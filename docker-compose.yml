# Local MySQL for Laravel (install Docker Desktop, then: docker compose up -d)
services:
  mysql:
    image: mysql:8.0
    container_name: sp_capstone_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: capstonedb
      MYSQL_DATABASE: sp_capstone_db
    ports:
      - "33063:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcapstonedb"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - sp_mysql_data:/var/lib/mysql

volumes:
  sp_mysql_data:
